services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: 1
      INTEGRATIONS_DIRECTORY: /var/lib/aurelia
    volumes:
      - integrations:/var/lib/aurelia
    expose:
      - "5000"
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/compose.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  integrations:
  caddy_data:
  caddy_config:
